[book]
authors = ["Forgeyard Maintainers"]
language = "en"
src = "src"
title = "Forgeyard System Architecture & Engineering Documentation"

[output.html]
git-repository-url = "https://github.com/irshadali5/forgeyard"
edit-url-template = "https://github.com/irshadali5/forgeyard/edit/main/{path}"
site-url = "/forgeyard/"
additional-css = ["theme/custom.css"]
additional-js = ["theme/mermaid.min.js", "theme/mermaid-init.js"]
preferred-dark-theme = "navy"
default-theme = "navy"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1
