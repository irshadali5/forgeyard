forgeyard-config = { path = "../forgeyard-config" }
forgeyard-model = { path = "../forgeyard-model" }
forgeyard-pipeline = { path = "../forgeyard-pipeline" }
forgeyard-runner = { path = "../forgeyard-runner" }
forgeyard-storage = { path = "../forgeyard-storage" }
forgeyard-cas = { path = "../forgeyard-cas" }
forgeyard-secrets = { path = "../forgeyard-secrets" }
forgeyard-signing = { path = "../forgeyard-signing" }
forgeyard-detector = { path = "../forgeyard-detector" }
forgeyard-api = { path = "../forgeyard-api" }
axum = "0.7"

forgeyard-protocol = { path = "../forgeyard-protocol" }
anyhow = "1.0"
tokio = { workspace = true, features = ["full"] }
