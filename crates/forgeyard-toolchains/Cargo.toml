flate2 = "1.0"
tempfile = "3.10"
tracing = "0.1"
forgeyard-cas = { path = "../forgeyard-cas" }
forgeyard-model = { path = "../forgeyard-model" }
async-trait = { workspace = true }
hex.workspace = true
