[package]
name = "forgeyard-toolchains"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later OR Commercial"

[dependencies]
anyhow = "1.0"
tokio = { workspace = true, features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
